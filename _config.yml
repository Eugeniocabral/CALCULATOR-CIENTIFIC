title: "Calculator Cientific"
description: "Es un sitio web creado con GitHub Pages y Jekyll."
url: "https://eugeniocabral.github.io"

author:
  name: "Eugenio Cabral"
  email: "kalefcabral@gmail.com"
  github: "https://github.com/eugeniocabral"

theme: jekyll-theme-cayman

markdown: kramdown

kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-mentions

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

paginate: 5
paginate_path: "/page:num/"
