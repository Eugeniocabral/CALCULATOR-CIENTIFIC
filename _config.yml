#INFORMACION DEL SITIO
title: "CALCULATOR CIENTIFIC"
DESCRIPTION: "Es un sitio web creado con GitHub pages y jekyll."
url: "https//eugeniocabral.github.io"

#autor
author: 
name: "Eugenio Cabral"
email: "kalefcabral@gmail.com"
cgithub: "htpps//github.com/eugeniocabral"

#tema
theme: jekyll-theme-cayman

#configuracion del markdown
markdow: kramdown
kramdown: 
     imput: GFM

#plugins
